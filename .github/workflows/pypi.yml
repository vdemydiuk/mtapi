name: Publish PyMtApi5 to PyPI

# Publishes only when a GitHub release is published (tag vX.Y.Z) whose commit
# is on master and whose tag matches PyMtApi5.__version__.
# Pushes and pull requests to dev (and manual runs) only test and build.
on:
  release:
    types: [published]
  push:
    branches: [dev]
    paths: ["PyMtApi5/**", ".github/workflows/pypi.yml"]
  pull_request:
    branches: [dev]
    paths: ["PyMtApi5/**", ".github/workflows/pypi.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history for release runs, so the master check can see ancestry
          fetch-depth: ${{ github.event_name == 'release' && 0 || 1 }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build websockets
      - name: Run unit tests
        run: python -m unittest discover -s PyMtApi5/tests -t .
      - name: Build sdist and wheel
        run: python -m build PyMtApi5 --outdir dist
      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import PyMtApi5; print(PyMtApi5.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "PyMtApi5.__version__ ($version) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi
      - name: Check release commit is on master
        if: github.event_name == 'release'
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on master"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymtapi5
    permissions:
      id-token: write   # trusted publishing
      contents: write   # attach files to the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
